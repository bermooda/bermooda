openapi: 3.1.0
info:
  title: bermooda REST API
  version: 1.1.0
  description: |
    Storefront and admin REST API for bermooda ecommerce.
    Admin routes require Bearer berm_ API keys unless noted (setup/*).
    See docs/api.md for full narrative docs. This file tracks the agent-facing
    contract for MCP/SDK derivation (Phase A).

servers:
  - url: /
    description: Application origin

tags:
  - name: Storefront
  - name: Setup
  - name: Admin

paths:
  /api/v1/catalog:
    get:
      summary: List published products
      tags: [Storefront]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
        - { name: locale, in: query, schema: { type: string } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Product list

  /api/v1/categories:
    get:
      summary: List storefront categories
      tags: [Storefront]
      parameters:
        - { name: locale, in: query, schema: { type: string } }
      responses:
        '200':
          description: Categories

  /api/v1/cart:
    post:
      summary: Create cart
      tags: [Storefront]
      responses:
        '201':
          description: Cart created

  /api/v1/products/{productId}/reviews:
    get:
      summary: List product reviews
      tags: [Storefront]
      parameters:
        - {
            name: productId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        '200':
          description: Reviews
    post:
      summary: Submit a review
      tags: [Storefront]
      parameters:
        - {
            name: productId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        '201':
          description: Review created

  /api/v1/checkout:
    post:
      summary: Create checkout session
      tags: [Storefront]
      responses:
        '201':
          description: Checkout session

  /api/admin/v1/setup:
    get:
      summary: Bootstrap readiness status
      tags: [Setup]
      responses:
        '200':
          description: Setup status snapshot

  /api/admin/v1/setup/admin:
    post:
      summary: Create first admin (when onboarding available)
      tags: [Setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
                confirmPassword: { type: string }
      responses:
        '201':
          description: Admin created
        '409':
          description: Setup already complete

  /api/admin/v1/setup/api-key:
    post:
      summary: Create first bootstrap API key
      description: Requires SETUP_TOKEN via X-Setup-Token or Bearer.
      tags: [Setup]
      security: [{ setupToken: [] }]
      parameters:
        - name: X-Setup-Token
          in: header
          schema: { type: string }
      responses:
        '201':
          description: Bootstrap key created (raw key returned once)
        '401':
          description: SETUP_TOKEN missing or invalid
        '409':
          description: API key already exists

  /api/admin/v1/settings:
    get:
      summary: Get shop settings snapshot
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Settings
    patch:
      summary: Patch one settings section
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Updated settings

  /api/admin/v1/themes:
    get:
      summary: List themes and active theme
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Themes
    patch:
      summary: Activate theme and/or save settings
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Updated themes payload

  /api/admin/v1/plugins:
    get:
      summary: List plugins and enabled state
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Plugins
    patch:
      summary: Enable/disable, reorder, or save plugin settings
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Updated plugins payload

  /api/admin/v1/categories:
    get:
      summary: List admin categories
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: locale, in: query, schema: { type: string } }
      responses:
        '200':
          description: Categories
    post:
      summary: Create category
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Category created

  /api/admin/v1/categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get category
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Category
    patch:
      summary: Update category
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Category updated
    delete:
      summary: Delete category recursively
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Deleted

  /api/admin/v1/products:
    get:
      summary: List products (admin)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Products
    post:
      summary: Create product
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Product created

  /api/admin/v1/products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get product
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Product
    patch:
      summary: Update product
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Product updated
    delete:
      summary: Delete product
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Deleted

  /api/admin/v1/collections:
    get:
      summary: List collections
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Collections
    post:
      summary: Create collection
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Collection created

  /api/admin/v1/orders:
    get:
      summary: List orders
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Orders

  /api/admin/v1/orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get order
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Order
    patch:
      summary: Update order status
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Order updated

  /api/admin/v1/api-keys:
    get:
      summary: List API keys
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: API keys
    post:
      summary: Create API key
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Key created (raw key returned once)

  /api/admin/v1/api-keys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get API key
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: API key
    delete:
      summary: Revoke API key
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Revoked

  /api/admin/v1/inventory/locations:
    get:
      summary: List inventory locations and levels
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Locations
    post:
      summary: Create inventory location
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Location created

  /api/admin/v1/inventory/levels:
    put:
      summary: Set inventory level quantity
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, locationId, quantity]
              properties:
                variantId: { type: string }
                locationId: { type: string }
                quantity: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Level updated

  /api/admin/v1/media:
    post:
      summary: Upload media
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Media created

  /api/admin/v1/media/{id}:
    get:
      summary: Get media metadata
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Media

  /api/admin/v1/audit-logs:
    get:
      summary: List audit log entries
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Audit logs

  /api/admin/v1/imports:
    post:
      summary: Import products (CSV)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Import result

  /api/admin/v1/webhook-subscriptions:
    get:
      summary: List webhook subscriptions
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Subscriptions
    post:
      summary: Create webhook subscription
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Created

  /api/admin/v1/webhook-subscriptions/{id}:
    get:
      summary: Get webhook subscription and recent deliveries
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Subscription
    patch:
      summary: Update webhook subscription
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete webhook subscription
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted

  /api/admin/v1/gift-cards:
    get:
      summary: List gift cards
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Gift cards
    post:
      summary: Issue gift card
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Gift card issued

  /api/admin/v1/wishlists:
    get:
      summary: Get customer wishlist items
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: customerId,
            in: query,
            required: true,
            schema: { type: string },
          }
      responses:
        '200':
          description: Wishlist items
    post:
      summary: Add or remove wishlist item
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Updated wishlist

  /api/admin/v1/pos:
    post:
      summary: POS session and draft order actions
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: POS action result

  /api/admin/v1/subscriptions/plans:
    get:
      summary: List subscription plans
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Plans
    post:
      summary: Create subscription plan
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Plan created

  /api/admin/v1/reports/overview:
    get:
      summary: Sales overview KPIs
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { name: locale, in: query, schema: { type: string } }
      responses:
        '200':
          description: Overview metrics

  /api/admin/v1/reports/sales-over-time:
    get:
      summary: Daily sales buckets
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Sales over time

  /api/admin/v1/reports/sales-by-product:
    get:
      summary: Top products by revenue
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { name: locale, in: query, schema: { type: string } }
      responses:
        '200':
          description: Sales by product

  /api/admin/v1/reports/sales-by-category:
    get:
      summary: Revenue by category
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { name: locale, in: query, schema: { type: string } }
      responses:
        '200':
          description: Sales by category

  /api/admin/v1/reports/ops:
    get:
      summary: Operational metrics (abandoned, recent orders, low stock)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        '200':
          description: Ops metrics

  /api/admin/v1/reports/customers:
    get:
      summary: Customer analytics (new/returning, top spenders)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        '200':
          description: Customer metrics

  /api/admin/v1/reports/inventory:
    get:
      summary: Inventory snapshot (low/out of stock, value, by location)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { name: locale, in: query, schema: { type: string } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: threshold, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Inventory metrics

  /api/admin/v1/reports/exports:
    get:
      summary: Scheduled export health metrics
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        '200':
          description: Export metrics

  /api/admin/v1/reports/dashboard:
    get:
      summary: Composed sales + ops dashboard report
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { name: locale, in: query, schema: { type: string } }
      responses:
        '200':
          description: Full dashboard report

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Admin API key (berm_...)
    setupToken:
      type: apiKey
      in: header
      name: X-Setup-Token
      description: One-shot SETUP_TOKEN for bootstrap API key creation
