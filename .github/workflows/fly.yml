# Moved from .github/_workflows/fly.yml (inactive underscore prefix) to activate on GitHub Actions.
# The original _workflows/fly.yml is left in place for history; it is a no-op duplicate.
name: Fly Deploy
on:
  push:
    branches:
      - master # change to main branch if needed
jobs:
  deploy:
    name: Deploy app
    runs-on: blacksmith-4vcpu-ubuntu-2404
    concurrency: deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
