name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./sqlite.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run check:i18n

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run prisma:generate
      - run: npm run build
      # Rebuild with a fixture theme that has its own locked nested deps, then
      # drop its node_modules (as the Docker image does) and check the server
      # bundle still imports and the client chunk stays free of semver.
      - name: Extension smoke build
        run: |
          cp -R scripts/fixtures/extension-smoke app/themes/extension-smoke
          npm run build
          rm -rf app/themes/extension-smoke/node_modules
          node scripts/check-extension-smoke-build.mjs
    env:
      DATABASE_URL: file:./sqlite.db

  test-postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bermooda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bermooda_test
      DATABASE_PROVIDER: postgresql
      QUEUE_DATABASE_PATH: ./prisma/queue-test.db
      BETTER_AUTH_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/sync-prisma-provider.js
      - run: npm run prisma:generate
      - run: npx prisma db push
      - run: npm run test
