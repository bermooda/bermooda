name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        # Manifest-driven: release-please-config.json + .release-please-manifest.json
        # Default GITHUB_TOKEN is enough when publish runs in this same workflow
        # (release_created output), so a PAT is not required for npm publish.

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # Do not set registry-url — it writes an .npmrc that conflicts with
          # npm trusted publishing (OIDC).
          # Do not cache deps for release publishes (npm trusted publishing guidance)

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: file:./sqlite.db

      - name: Publish to npm
        # No NPM_TOKEN — OIDC trusted publishing. Provenance via publishConfig.
        run: npm publish
